name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Structurally-valid placeholders only — no test hits a live project.
      # src/lib/supabase.ts calls createClient() eagerly at module scope, so
      # any module that imports it (even indirectly, for an unrelated pure
      # helper) throws at import time without these.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build
