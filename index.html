    <!-- Loaded non-render-blocking: the boot splash must paint immediately even

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "WebSite",
            "@id": "https://agilearn.vercel.app/#website",
            "name": "Agilearn",
            "url": "https://agilearn.vercel.app/",
            "inLanguage": "en-PH"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Agilearn",
            "url": "https://agilearn.vercel.app/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web, iOS, Android",
            "description": "Class records with weighted lecture and lab finals, offline attendance, a private teaching-modules library and per-student grade emails for Filipino teachers.",

    <!-- Installed-PWA (iOS): run standalone without Safari chrome / URL bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agilearn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Boot splash. Dismissal is an "iris": a hole opens from the logo and
         grows to reveal the app (mask + animated --iris). Without @property the
         hole jumps open and the opacity fade still finishes the handoff. */
      @property --iris {
        syntax: '<length>';
        inherits: false;
        initial-value: 0px;
      }
      #app-boot-splash {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background:
          radial-gradient(
            60vmax 60vmax at 50% 42%,
            #ffe9d6 0%,
            rgba(255, 233, 214, 0) 60%
          ),
          #fffaf6;
        color: #2b231b;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
        --iris: 0px;
        -webkit-mask: radial-gradient(
          circle at 50% 42%,
          transparent calc(var(--iris) - 1px),
          #000 var(--iris)
        );
        mask: radial-gradient(
          circle at 50% 42%,
          transparent calc(var(--iris) - 1px),
          #000 var(--iris)
        );
        transition:
          --iris 720ms cubic-bezier(0.65, 0, 0.35, 1),
          opacity 220ms ease-out 560ms;
      }
      /* Intentionally NOT theme-aware: the OS-drawn splash always uses the
         manifest's background_color (#fffaf6), so matching it here makes the
         native→web handoff seamless. A theme-aware splash produced a hard
         cream→dark cut at that boundary. */
      #app-boot-splash[data-ready='true'] {
        --iris: 150vmax;
        opacity: 0;
        pointer-events: none;
      }
      #app-boot-splash .bs-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 5.5rem;
        height: 5.5rem;
        margin-top: -8vh;
        border-radius: 1.6rem;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(120, 70, 20, 0.08),
          0 18px 40px -18px rgba(120, 70, 20, 0.45);
        animation: bs-breathe 2.4s ease-in-out infinite;
        transition:
          transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 220ms ease-out;
      }
      #app-boot-splash .bs-mark img {
        width: 3.6rem;
        height: 3.6rem;
      }
      /* Ember arc orbiting the mark while the app loads. */
      #app-boot-splash .bs-ring {
        position: absolute;
        inset: -0.55rem;
        border-radius: 2rem;
        background: conic-gradient(
          from 0deg,
          transparent 0 62%,
          #f0863a 82%,
          #ffd6b2 92%,
          transparent 100%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
        padding: 2px;
        animation: bs-spin 1.1s linear infinite;
      }
      #app-boot-splash strong {
        margin-top: 0.5rem;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      #app-boot-splash span {
        font-size: 0.875rem;
        color: #6f6151;
      }
      #app-boot-splash strong,
      #app-boot-splash span {
        transition: opacity 200ms ease-out;
      }
      #app-boot-splash[data-ready='true'] .bs-mark {
        transform: scale(1.12);
        opacity: 0;
        animation: none;
      }
      #app-boot-splash[data-ready='true'] strong,
      #app-boot-splash[data-ready='true'] span {
        opacity: 0;
      }
      @keyframes bs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bs-breathe {
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash {
          -webkit-mask: none;
          mask: none;
          transition: opacity 160ms ease-out;
        }
        #app-boot-splash .bs-mark,
        #app-boot-splash .bs-ring {
          animation: none;
          transition: none;
        }
      }
    </style>
    <title>
      Agilearn | Class records, attendance and weighted grades for Filipino teachers
    </title>
    <!-- Apply the stored/system theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var isStandalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          if (isStandalone) {
            document
              .getElementById('viewport-meta')
              .setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover',
              )
          }
          var t = localStorage.getItem('agilearn-theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // Keep in sync with applyTheme() in src/lib/theme.ts — without this
          // the 'white' theme flashes the default light palette first.
          document.documentElement.classList.toggle('calm-white', t === 'white')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#17110d' : '#fffaf6')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app-boot-splash" role="status" aria-label="Loading Agilearn">
      <div class="bs-mark">
        <i class="bs-ring" aria-hidden="true"></i>
        <img src="/icon-192.png" alt="" width="58" height="58" />
      </div>
      <strong>Agilearn</strong>
      <span>Preparing your workspace</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
