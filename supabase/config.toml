# Supabase local development config.
# Enables `supabase start` and `supabase gen types typescript --local > src/lib/database.types.ts`.
# For a hosted project, use `--project-id <ref>` instead (see docs/DEPLOYMENT.md).

project_id = "agilearn"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
# teaching-modules bucket is created by migration 0005.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Teacher self-sign-up is allowed but gated: handle_new_user() rejects any email
# whose domain is not in public.allowed_email_domains (migration 0007). Admins
# are still provisioned out-of-band.
enable_signup = true

[auth.email]
enable_signup = true
# Require email verification. The signup flow verifies a 6-digit OTP; make sure
# the "Confirm signup" and "Reset password" templates include {{ .Token }}.
enable_confirmations = true

[analytics]
enabled = false
