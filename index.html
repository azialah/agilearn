<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta
      id="viewport-meta"
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf5ec" />
    <meta
      name="description"
      content="Agilearn: school management platform for teachers and administrators."
    />
    <!-- Installed-PWA (iOS): run standalone without Safari chrome / URL bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agilearn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Agilearn</title>
    <!-- Apply the stored/system theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var isStandalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          if (isStandalone) {
            document
              .getElementById('viewport-meta')
              .setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover',
              )
          }
          var t = localStorage.getItem('agilearn-theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#17110d' : '#faf5ec')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
