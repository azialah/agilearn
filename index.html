<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-render-blocking: the boot splash must paint immediately even
         if this cross-origin stylesheet is slow. `display=swap` keeps text
         visible in the fallback face until it arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap"
      onload="
        this.rel = 'stylesheet'
        this.onload = null
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap"
      />
    </noscript>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta
      id="viewport-meta"
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf5ec" />
    <meta
      name="description"
      content="Agilearn: school management platform for teachers and administrators."
    />
    <!-- Installed-PWA (iOS): run standalone without Safari chrome / URL bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agilearn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      #app-boot-splash {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #faf5ec;
        color: #2e2118;
        font-family: 'Stack Sans Text', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 180ms ease-out;
      }
      /* Intentionally NOT theme-aware: the OS-drawn splash always uses the
         manifest's background_color (#faf5ec), so matching it here makes the
         native→web handoff seamless. A theme-aware splash produced a hard
         cream→dark cut at that boundary. */
      #app-boot-splash[data-ready='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #app-boot-splash img {
        width: 4rem;
        height: 4rem;
      }
      #app-boot-splash strong {
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      #app-boot-splash span {
        font-size: 0.875rem;
        opacity: 0.68;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash {
          transition: none;
        }
      }
    </style>
    <title>Agilearn</title>
    <!-- Apply the stored/system theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var isStandalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          if (isStandalone) {
            document
              .getElementById('viewport-meta')
              .setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover',
              )
          }
          var t = localStorage.getItem('agilearn-theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // Keep in sync with applyTheme() in src/lib/theme.ts — without this
          // the 'white' theme flashes the default light palette first.
          document.documentElement.classList.toggle('calm-white', t === 'white')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#17110d' : '#faf5ec')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app-boot-splash" role="status" aria-label="Loading Agilearn">
      <img src="/icon-192.png" alt="" />
      <strong>Agilearn</strong>
      <span>Preparing your workspace</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
